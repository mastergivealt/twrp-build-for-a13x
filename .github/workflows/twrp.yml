name: Ultimate Automated TWRP Builder

on:
  workflow_dispatch:
    inputs:
      RECOVERY_URL:
        description: 'Paste the DIRECT download URL of your recovery.img'
        required: true
        default: 'https://files.catbox.moe/jxz5li.img'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Your Repository
      uses: actions/checkout@v4

    - name: Download Recovery Image From External URL
      env:
        RAW_URL: ${{ github.event.inputs.RECOVERY_URL }}
      run: |
        echo "📥 Downloading recovery.img from external link..."
        
        # Proper command substitution using $()
        CLEAN_URL=$(echo "$RAW_URL" | sed 's/\\//g')
        curl -L -o recovery.img "$CLEAN_URL"
        
        if [ ! -s "recovery.img" ]; then
          echo "❌ Error: Download failed or file is empty! Check your link."
          exit 1
        fi
        echo "✅ recovery.img downloaded successfully. Size: $(du -sh recovery.img | cut -f1)"

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install twrpdtgen & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cpio
        pip3 install twrpdtgen

    - name: Generate Device Tree from recovery.img
      run: |
        mkdir -p dt-output
        python3 -m twrpdtgen recovery.img -o dt-output/
        
        MANUFACTURER=$(ls dt-output/)
        CODENAME=$(ls dt-output/$MANUFACTURER/)
        
        echo "MANUFACTURER=$MANUFACTURER" >> $GITHUB_ENV
        echo "CODENAME=$CODENAME" >> $GITHUB_ENV
        echo "✅ Device tree generated for $MANUFACTURER / $CODENAME"

    - name: Clean up and Prepare Android Build Environment
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get install -y bc build-essential zip curl libc6-dev libncurses5-dev libssl-dev libxml2-utils xsltproc unzip gnupg repo

    - name: Set up Git Identity
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"

    - name: Sync TWRP Source Code
      run: |
        mkdir twrp-source && cd twrp-source
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-12.1
        repo sync -j$(nproc) --force-sync --no-clone-bundle --no-tags

    - name: Move Generated Device Tree to Source
      run: |
        mkdir -p twrp-source/device/${{ env.MANUFACTURER }}/${{ env.CODENAME }}
        cp -r dt-output/${{ env.MANUFACTURER }}/${{ env.CODENAME }}/* twrp-source/device/${{ env.MANUFACTURER }}/${{ env.CODENAME }}/

    - name: Build TWRP Recovery Image
      run: |
        cd twrp-source
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        
        # Remove deprecated vendorsetup.sh generated by twrpdtgen to avoid lunch errors
        rm -f device/${{ env.MANUFACTURER }}/${{ env.CODENAME }}/vendorsetup.sh
        
        TARGET_FILE="device/${{ env.MANUFACTURER }}/${{ env.CODENAME }}/AndroidProducts.mk"
        
        if [ -f "$TARGET_FILE" ]; then
          LUNCH_TARGET=$(grep -oP 'twrp_.*(?=-eng)' "$TARGET_FILE" | head -n 1)
        fi
        
        if [ -z "$LUNCH_TARGET" ]; then
          LUNCH_TARGET="twrp_${{ env.CODENAME }}"
        fi
        
        echo "Lunching target: ${LUNCH_TARGET}-eng"
        lunch ${LUNCH_TARGET}-eng
        mka recoveryimage -j$(nproc)

    - name: Package Output into Samsung Odin Tar File
      run: |
        cd twrp-source/out/target/product/${{ env.CODENAME }}/
        tar -cvf twrp_samsung_${{ env.CODENAME }}.tar recovery.img
        mv twrp_samsung_${{ env.CODENAME }}.tar $GITHUB_WORKSPACE/

    - name: Create Release and Upload Odin Tar File
      uses: softprops/action-gh-release@v2
      with:
        tag_name: TWRP-v${{ github.run_number }}
        name: TWRP Custom Recovery for ${{ env.MANUFACTURER }} ${{ env.CODENAME }} (Build #${{ github.run_number }})
        body: |
          Automated compilation successful!
          - Generated device tree dynamically from your stock `recovery.img`.
          - Source Base: Minimal Manifest TWRP Android 12.1.
          - Device Codename: ${{ env.CODENAME }}
          
          Flash the attached `.tar` file via Odin in the **AP** slot.
        files: |
          twrp_samsung_${{ env.CODENAME }}.tar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
